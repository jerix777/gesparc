# /etc/nginx/sites-available/gesparc — à adapter (nom de domaine, chemins des certificats).
server {
    listen 80;
    server_name gesparc.exemple.ci;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gesparc.exemple.ci;
    root /var/www/gesparc/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/gesparc.exemple.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gesparc.exemple.ci/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
